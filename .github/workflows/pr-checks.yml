
name: Portfolio Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML title tags
        run: |
          for file in *.html; do
            if ! grep -Eiq '<title>[^<]+</title>' "$file"; then
              echo "ERROR: Missing title in $file"
              exit 1
            fi
          done
          echo "All HTML files have title tags"

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image alt attributes
        run: |
          if grep -E '<img[^>]*>' index.html | grep -Eiv 'alt='; then
            echo "ERROR: Images are missing alt attributes"
            exit 1
          fi
          echo "All images have alt attributes"

  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for console.log
        run: |
          if grep -RIn --include='*.js' 'console\.log' js/; then
            echo "ERROR: Remove console.log statements"
            exit 1
          fi
          echo "No console.log statements found"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      - check-html-titles
      - check-image-alt
      - check-no-console-log
    steps:
      - name: All checks passed
        run: echo "All PR quality checks passed! Ready for review."
